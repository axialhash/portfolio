<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#050505"/>
  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>
  <!-- Geometric shape - abstract A/X mark -->
  <g transform="translate(256, 256)">
    <!-- Outer hexagon frame -->
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
    <!-- Inner triangle - the "A" -->
    <polygon points="0,-100 87,50 -87,50" fill="none" stroke="url(#brand)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Crossbar of A -->
    <line x1="-44" y1="0" x2="44" y2="0" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
    <!-- Center dot - the "eye" -->
    <circle cx="0" cy="-30" r="8" fill="#60A5FA"/>
    <!-- X mark overlay - subtle -->
    <line x1="-50" y1="-60" x2="50" y2="60" stroke="#60A5FA" stroke-width="1.5" opacity="0.15"/>
    <line x1="50" y1="-60" x2="-50" y2="60" stroke="#60A5FA" stroke-width="1.5" opacity="0.15"/>
  </g>
  <!-- Bottom accent line -->
  <line x1="156" y1="420" x2="356" y2="420" stroke="#2563EB" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
